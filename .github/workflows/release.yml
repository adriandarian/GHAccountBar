name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Run Swift tests
        run: |
          swift --version
          swift test

      - name: Build and verify release package
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          version="${VERSION_TAG#v}"
          bash Tests/Packaging/package_release_test.sh "$version" "$GITHUB_RUN_NUMBER"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          zip="dist/GHAccountBar-v${version}-arm64.zip"
          checksum="${zip}.sha256"
          notes="docs/releases/v${version}.md"
          test -f "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" "$checksum" --clobber
            gh release edit "$tag" --prerelease --title "GHAccountBar $tag" --notes-file "$notes"
          else
            gh release create "$tag" "$zip" "$checksum" \
              --verify-tag \
              --prerelease \
              --latest=false \
              --title "GHAccountBar $tag" \
              --notes-file "$notes"
          fi
